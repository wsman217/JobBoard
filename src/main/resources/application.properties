spring.application.name=JobBoard

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Flyway ---
spring.flyway.enabled=true

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Google OAuth2 login ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# --- Application JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=jobboard
app.jwt.audience=jobboard
app.jwt.access-token-ttl-seconds=3600

# --- Post-login redirect target for the issued JWT ---
app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:3000}

server.forward-headers-strategy=framework